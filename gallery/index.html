<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معرض الرسائل المسجلة - استبيان مركز الشباب</title>
    
    <!-- حماية من السكرين شوت -->
    <meta name="msapplication-config" content="none">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="../style.css">
    
    <!-- Gallery Specific Styles -->
    <style>
        /* ==================== حماية الصفحة ==================== */
        
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
        }
        
        body { 
            align-items: flex-start !important;
            justify-content: flex-start !important;
            padding: 30px 20px !important; 
            overflow-y: auto; 
            overflow-x: hidden;
            direction: rtl;
            min-height: 100vh;
            -webkit-user-drag: none !important;
            user-drag: none !important;
            background: linear-gradient(135deg, #0f172a 0%, #064e3b 50%, #0f172a 100%) !important;
        }
        
        /* ==================== Header Section ==================== */
        
        .gallery-wrapper {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }
        
        .gallery-header { 
            text-align: center; 
            margin-bottom: 40px; 
            position: relative;
            padding: 40px 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 30px;
            border: 1px solid rgba(16,185,129,0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .gallery-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            border-radius: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(5,150,105,0.3);
            animation: gentleFloat 4s ease-in-out infinite;
        }
        
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .gallery-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 12px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .gallery-subtitle {
            font-size: 1.15rem;
            color: rgba(209,250,229,0.8);
            margin-bottom: 25px;
            font-weight: 500;
        }
        
        /* ==================== Stats Bar ==================== */
        
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding: 18px;
            background: rgba(255,255,255,0.04);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255,255,255,0.75);
            font-size: 0.95rem;
            font-weight: 600;
        }
        
        .stat-item i {
            font-size: 1.15rem;
        }
        
        .stat-item.video-icon i { color: #34d399; }
        .stat-item.audio-icon i { color: #fbbf24; }
        .stat-item.views-icon i { color: #60a5fa; }
        
        /* ==================== Protection Notice ==================== */
        
        .protection-notice {
            max-width: 600px;
            margin: 0 auto 25px;
            padding: 14px 20px;
            background: rgba(16,185,129,0.08);
            border-radius: 14px;
            border: 1px dashed rgba(16,185,129,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .protection-notice p {
            color: rgba(167,243,208,0.9);
            font-size: 0.88rem;
            margin: 0;
            font-weight: 600;
        }
        
        .protection-notice i {
            color: #10b981;
            font-size: 1rem;
        }
        
        /* ==================== Filter Tabs ==================== */
        
        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 12px 28px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.7);
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .filter-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            border-color: transparent;
            color: white;
            box-shadow: 0 6px 24px rgba(5,150,105,0.35);
        }
        
        .filter-btn i {
            font-size: 1rem;
        }
        
        /* ==================== Media Grid ==================== */
        
        .media-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); 
            gap: 25px; 
            width: 100%; 
        }
        
        /* ==================== Media Card with Enhanced Design ==================== */
        
        .media-card { 
            background: rgba(15,23,42,0.7); 
            border-radius: 24px; 
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        .media-card:hover { 
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 60px rgba(0,0,0,0.4), 0 0 40px rgba(16,185,129,0.1);
            border-color: rgba(16,185,129,0.3);
        }
        
        /* Featured Ribbon */
        .featured-ribbon {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 25;
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            color: #78350f;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 16px rgba(245,158,11,0.4);
            animation: ribbonPulse 2s ease-in-out infinite;
        }
        
        @keyframes ribbonPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .featured-ribbon i {
            font-size: 0.7rem;
        }
        
        /* ==================== Video Container with Protection ==================== */
        
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 0;
            overflow: hidden;
            background: #000;
        }
        
        /* Protection Overlay */
        .video-protection-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            cursor: pointer;
            background: transparent;
        }
        
        /* Watermark */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.12);
            font-weight: bold;
            pointer-events: none;
            z-index: 20;
            white-space: nowrap;
            letter-spacing: 3px;
            animation: watermarkPulse 3s ease-in-out infinite;
            font-family: 'Cairo', sans-serif;
        }
        
        @keyframes watermarkPulse {
            0%, 100% { opacity: 0.08; }
            50% { opacity: 0.16; }
        }
        
        /* Corner Watermark */
        .corner-watermark {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 11px;
            color: rgba(245,158,11,0.45);
            pointer-events: none;
            z-index: 25;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'Cairo', sans-serif;
        }
        
        .media-card video, 
        .media-card audio { 
            width: 100%; 
            height: 100%;
            outline: none;
            display: block;
            object-fit: cover;
            pointer-events: none;
        }
        
        .media-card audio { 
            height: 55px; 
            margin-top: 15px;
            pointer-events: auto;
            object-fit: contain;
        }
        
        /* Audio Card Style */
        .audio-container {
            aspect-ratio: 16/9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(15,23,42,1) 0%, rgba(30,41,59,1) 100%);
            padding: 30px;
            gap: 15px;
        }
        
        .audio-icon-large {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            box-shadow: 0 8px 32px rgba(5,150,105,0.3);
        }
        
        .audio-label {
            color: rgba(148,163,184,0.8);
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
        }
        
        /* ==================== Custom Video Controls ==================== */
        
        .play-btn-large {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 26px;
            cursor: pointer;
            z-index: 30;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 0 rgba(16,185,129,0.4);
            animation: playBtnGlow 2s ease-in-out infinite;
        }
        
        @keyframes playBtnGlow {
            0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 0 rgba(16,185,129,0.4); }
            50% { box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 12px rgba(16,185,129,0); }
        }
        
        .play-btn-large:hover {
            transform: translate(-50%, -50%) scale(1.12);
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
        }
        
        .play-btn-large.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.8);
        }
        
        .play-btn-large i {
            margin-right: -4px;
        }
        
        /* Progress Bar */
        .progress-bar {
            position: absolute;
            bottom: 55px;
            left: 12px;
            right: 12px;
            height: 5px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            z-index: 25;
            cursor: pointer;
            transition: height 0.2s ease;
        }
        
        .progress-bar:hover {
            height: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #059669 0%, #fbbf24 100%);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
            position: relative;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            right: -5px;
            top: 50%;
            transform: translateY(-50%);
            width: 11px;
            height: 11px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .progress-bar:hover .progress-fill::after {
            opacity: 1;
        }
        
        /* Time Display */
        .time-display {
            position: absolute;
            bottom: 58px;
            right: 16px;
            font-size: 11px;
            color: white;
            z-index: 28;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            font-family: monospace;
            font-weight: 600;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 4px;
        }
        
        /* Video Controls */
        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 14px;
            background: linear-gradient(transparent, rgba(0,0,0,0.92));
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 27;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .video-container:hover .video-controls,
        .video-container.playing .video-controls {
            opacity: 1;
        }
        
        .control-btn {
            background: rgba(255,255,255,0.12);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        
        .control-btn:hover {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 4px 16px rgba(5,150,105,0.4);
        }
        
        .control-btn i {
            font-size: 0.95rem;
        }
        
        /* ==================== Media Meta Info ==================== */
        
        .media-content {
            padding: 20px;
        }
        
        .media-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            line-height: 1.4;
            font-family: 'Cairo', sans-serif;
        }
        
        .media-description {
            font-size: 0.9rem;
            color: rgba(148,163,184,0.85);
            margin-bottom: 16px;
            line-height: 1.55;
            font-family: 'Cairo', sans-serif;
        }
        
        .media-meta { 
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.06);
            font-size: 0.82rem;
            color: rgba(148,163,184,0.7);
        }
        
        .meta-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .meta-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        
        .meta-badge {
            background: rgba(255,255,255,0.06);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(203,213,225,0.8);
            border: 1px solid rgba(255,255,255,0.08);
        }
        
        /* ==================== Warning Toast ==================== */
        
        .warning-toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            color: white;
            padding: 16px 32px;
            border-radius: 16px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            z-index: 99999;
            box-shadow: 0 12px 48px rgba(220,38,38,0.45);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.15);
        }
        
        .warning-toast.show {
            transform: translateX(-50%) translateY(0);
        }
        
        .warning-toast i {
            font-size: 1.2rem;
            animation: shieldShake 0.5s ease-in-out infinite;
        }
        
        @keyframes shieldShake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }
        
        /* ==================== Loader ==================== */
        
        .loader { 
            text-align: center; 
            padding: 60px 20px; 
            grid-column: 1 / -1;
        }
        
        .loader-spinner {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(16,185,129,0.15);
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 18px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loader p {
            color: rgba(148,163,184,0.8);
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
        }
        
        /* ==================== Empty State ==================== */
        
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 30px;
            background: rgba(15,23,42,0.5);
            border-radius: 28px;
            border: 2px dashed rgba(255,255,255,0.1);
        }
        
        .empty-state i {
            font-size: 4.5rem;
            color: rgba(71,85,105,0.5);
            margin-bottom: 22px;
        }
        
        .empty-state h3 {
            color: rgba(203,213,225,0.9);
            font-size: 1.35rem;
            margin-bottom: 10px;
            font-family: 'Cairo', sans-serif;
        }
        
        .empty-state p {
            color: rgba(148,163,184,0.65);
            font-size: 0.95rem;
            margin-bottom: 24px;
            font-family: 'Cairo', sans-serif;
        }
        
        /* ==================== Error State ==================== */
        
        .error-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 30px;
            background: rgba(127,29,29,0.15);
            border-radius: 28px;
            border: 2px dashed rgba(239,68,68,0.25);
        }
        
        .error-state i {
            font-size: 4rem;
            color: #f87171;
            margin-bottom: 20px;
        }
        
        .error-state h3 {
            color: #fecaca;
            font-size: 1.25rem;
            margin-bottom: 18px;
            font-family: 'Cairo', sans-serif;
        }
        
        .retry-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 13px 26px;
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 24px rgba(220,38,38,0.3);
        }
        
        .retry-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 32px rgba(220,38,38,0.4);
        }
        
        /* ==================== Back Button ==================== */
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(16,185,129,0.35);
            color: #34d399;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        
        .back-btn:hover {
            background: rgba(16,185,129,0.15);
            border-color: #10b981;
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(16,185,129,0.25);
        }
        
        /* ==================== Mobile Responsive ==================== */
        
        @media (max-width: 768px) {
            body {
                padding: 15px 12px !important;
            }
            
            .gallery-header {
                padding: 28px 16px;
                border-radius: 22px;
                margin-bottom: 28px;
            }
            
            .gallery-title {
                font-size: 1.75rem;
            }
            
            .gallery-subtitle {
                font-size: 1rem;
            }
            
            .gallery-icon {
                width: 64px;
                height: 64px;
                border-radius: 18px;
            }
            
            .stats-bar {
                gap: 16px;
                padding: 14px;
            }
            
            .stat-item {
                font-size: 0.82rem;
            }
            
            .filter-tabs {
                gap: 8px;
                margin-bottom: 24px;
            }
            
            .filter-btn {
                padding: 10px 20px;
                font-size: 0.85rem;
            }
            
            .media-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }
            
            .media-card {
                border-radius: 18px;
            }
            
            .media-content {
                padding: 16px;
            }
            
            .media-title {
                font-size: 1.05rem;
            }
            
            .play-btn-large {
                width: 56px;
                height: 56px;
                font-size: 22px;
            }
            
            .control-btn {
                width: 36px;
                height: 36px;
            }
            
            .featured-ribbon {
                padding: 5px 10px;
                font-size: 0.68rem;
                top: 10px;
                right: 10px;
            }
            
            .protection-notice {
                padding: 12px 14px;
            }
            
            .protection-notice p {
                font-size: 0.8rem;
            }
        }
        
        @media (max-width: 480px) {
            .gallery-title {
                font-size: 1.5rem;
            }
            
            .stats-bar {
                flex-direction: column;
                gap: 10px;
            }
            
            .stat-item {
                justify-content: center;
            }
            
            .filter-tabs {
                justify-content: stretch;
            }
            
            .filter-btn {
                flex: 1;
                justify-content: center;
            }
        }
        
        /* ==================== Custom Scrollbar ==================== */
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(15,23,42,0.5);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #059669 0%, #10b981 100%);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #047857 0%, #059669 100%);
        }
        
        /* ==================== Lightbox/Modal ==================== */
        
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.96);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        
        .lightbox-overlay.active {
            display: flex;
        }
        
        .lightbox-close {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10001;
        }
        
        .lightbox-close:hover {
            background: rgba(239,68,68,0.8);
            transform: rotate(90deg);
        }
        
        .lightbox-content {
            max-width: 1100px;
            width: 100%;
            background: rgba(15,23,42,0.95);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 32px 80px rgba(0,0,0,0.6);
        }
        
        .lightbox-media {
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
        }
        
        .lightbox-media video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .lightbox-info {
            padding: 24px;
        }
        
        .lightbox-info h3 {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-family: 'Cairo', sans-serif;
        }
        
        .lightbox-info p {
            color: rgba(148,163,184,0.8);
            margin-bottom: 18px;
            font-family: 'Cairo', sans-serif;
        }
        
        .lightbox-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .lightbox-meta span {
            color: rgba(148,163,184,0.6);
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* Lightbox for Audio */
        .lightbox-audio {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 30px;
            min-height: 400px;
        }
        
        .lightbox-audio i {
            font-size: 5rem;
            color: #10b981;
            margin-bottom: 24px;
        }
        
        .lightbox-audio audio {
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <!-- Warning Toast -->
    <div class="warning-toast" id="warningToast">
        <i class="fas fa-shield-alt"></i>
        <span>⚠️ هذا المحتوى محمي ولا يمكن تصويره أو تسجيله</span>
    </div>

    <!-- Main Gallery Container -->
    <div class="gallery-wrapper">
        <!-- Header Section -->
        <header class="gallery-header">
            <div class="gallery-icon">
                <i class="fas fa-photo-video" style="color: white; font-size: 2rem;"></i>
            </div>
            
            <h1 class="gallery-title">معرض الرسائل المسجلة</h1>
            <p class="gallery-subtitle">رسائل وآراء أهالي قرية الأحمدية حول مركز الشباب</p>
            
            <!-- Stats Bar -->
            <div class="stats-bar">
                <div class="stat-item video-icon">
                    <i class="fas fa-video"></i>
                    <span id="videoCount">0 فيديو</span>
                </div>
                <div class="stat-item audio-icon">
                    <i class="fas fa-microphone"></i>
                    <span id="audioCount">0 تسجيل صوتي</span>
                </div>
                <div class="stat-item views-icon">
                    <i class="fas fa-eye"></i>
                    <span id="totalViews">0 مشاهدة</span>
                </div>
            </div>
            
            <!-- Protection Notice -->
            <div class="protection-notice">
                <i class="fas fa-lock"></i>
                <p>جميع الفيديوهات والصوتيات محمية ولا يمكن تصويرها أو تسجيلها أو تنزيلها</p>
            </div>
            
            <!-- Back Button -->
            <a href="../index.html" class="back-btn">
                <i class="fas fa-arrow-right"></i>
                العودة للاستبيان الرئيسي
            </a>
        </header>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all" onclick="filterMedia('all')">
                <i class="fas fa-th-large"></i>
                الكل
            </button>
            <button class="filter-btn" data-filter="video" onclick="filterMedia('video')">
                <i class="fas fa-video"></i>
                فيديو
            </button>
            <button class="filter-btn" data-filter="audio" onclick="filterMedia('audio')">
                <i class="fas fa-microphone"></i>
                صوتي
            </button>
        </div>
        
        <!-- Media Grid -->
        <div class="media-grid" id="gallery-grid"></div>
        
        <!-- Loading Spinner -->
        <div class="loader" id="loading-spinner">
            <div class="loader-spinner"></div>
            <p>جاري تحميل الرسائل...</p>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox-overlay" id="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox()">
            <i class="fas fa-times"></i>
        </button>
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <div class="lightbox-media" id="lightbox-media"></div>
            <div class="lightbox-info" id="lightbox-info"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../firebase.js" type="module"></script>
    <script src="gallery.js"></script>
    <script src="protection.js"></script>
</body>
</html>
