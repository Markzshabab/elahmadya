<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإدارة - استبيان الأحمدية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <style>
        body { align-items: flex-start; padding: 20px; overflow-y: auto; }
        .admin-container { width: 100%; max-width: 1200px; margin: 0 auto; display: none; }
        .login-container { display: flex; flex-direction: column; justify-content: center; height: 80vh; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(0,0,0,0.2); border-radius: 12px; overflow: hidden; font-size: 0.95rem; }
        .data-table th, .data-table td { padding: 15px; text-align: center; border-bottom: 1px solid var(--glass-border); }
        .data-table th { background: rgba(0,242,254,0.1); color: var(--primary); }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div id="login-screen" class="glass-panel login-container active-screen">
        <h2><i class="fas fa-lock"></i> تسجيل دخول الإدارة</h2>
        <input type="password" id="admin-pass" placeholder="أدخل كلمة المرور" class="btn-outline" style="background: transparent; color: white; text-align: center; margin-bottom: 20px;">
        <button class="btn-primary" onclick="admin.login()">دخول</button>
    </div>

    <div id="dashboard-screen" class="admin-container glass-panel">
        <div class="top-bar">
            <h2>لوحة تحكم الاستبيان</h2>
            <button class="btn-danger" style="width: auto; margin:0;" onclick="admin.logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>

        <div class="controls">
            <button class="btn-primary" style="width: auto;" onclick="admin.exportCSV()"><i class="fas fa-file-csv"></i> تصدير CSV</button>
            <input type="text" id="search-box" placeholder="ابحث في الردود..." class="btn-outline" onkeyup="admin.searchTable()" style="width: 300px; padding: 10px; margin:0;">
        </div>

        <div style="overflow-x: auto;">
            <table class="data-table" id="submissions-table">
                <thead>
                    <tr>
                        <th>التاريخ والوقت</th>
                        <th>عنوان IP</th>
                        <th>السؤال الأول (الرضا)</th>
                        <th>السؤال الثاني (الشباب)</th>
                        <th>الرسالة المسجلة (فيديو/صوت)</th>
                        <th>الإجراءات والتحكم</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
