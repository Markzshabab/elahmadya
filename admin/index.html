<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Al Ahmadiya Survey</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css"> <!-- Reusing main styles -->
    <style>
        /* Admin specific styles */
        body { align-items: flex-start; padding: 20px; overflow-y: auto; }
        .admin-container { width: 100%; max-width: 1200px; margin: 0 auto; display: none; }
        .login-container { display: flex; flex-direction: column; justify-content: center; height: 80vh; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(0,0,0,0.2); border-radius: 12px; overflow: hidden; }
        .data-table th, .data-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--glass-border); }
        .data-table th { background: rgba(0,242,254,0.1); color: var(--primary); }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 0.85rem; }
        .badge.pending { background: #f39c12; color: #fff; }
        .badge.approved { background: #2ecc71; color: #fff; }
        .action-btn { padding: 8px 12px; margin: 0 5px; font-size: 0.9rem; width: auto; }
        .media-preview { max-width: 150px; border-radius: 8px; }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="glass-panel login-container active-screen">
        <h2><i class="fas fa-lock"></i> Admin Login</h2>
        <input type="password" id="admin-pass" placeholder="Enter Password" class="btn-outline" style="background: transparent; color: white; text-align: center; margin-bottom: 20px;">
        <button class="btn-primary" onclick="admin.login()">Login</button>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-screen" class="admin-container glass-panel">
        <div class="top-bar">
            <h2>Dashboard Overview</h2>
            <button class="btn-danger" style="width: auto;" onclick="admin.logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="admin.exportCSV()"><i class="fas fa-file-csv"></i> Export CSV</button>
            <button class="btn-primary" onclick="admin.exportJSON()"><i class="fas fa-file-code"></i> Export JSON</button>
            <input type="text" id="search-box" placeholder="Search entries..." class="btn-outline" onkeyup="admin.searchTable()" style="width: 300px; padding: 10px;">
        </div>

        <h3><i class="fas fa-photo-video"></i> Pending Media Submissions</h3>
        <table class="data-table" id="submissions-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Q1 (Satisfaction)</th>
                    <th>Q2 (Youth)</th>
                    <th>Media</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Data injected via JS -->
            </tbody>
        </table>
    </div>

    <script src="admin.js"></script>
</body>
</html>
